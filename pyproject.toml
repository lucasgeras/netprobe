[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "0.1.0"
description = "Lightweight host connectivity testing across ICMP, TCP, UDP, DNS, SSH and HTTP."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "lucas" }]
keywords = ["network", "connectivity", "ping", "tcp", "diagnostics", "reachability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
netprobe = "netprobe.cli:main"

[project.urls]
Homepage = "https://github.com/lucas/netprobe"

[tool.setuptools.packages.find]
include = ["netprobe*"]
